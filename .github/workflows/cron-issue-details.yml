name: Cron - Issue Details

# DR-5: once daily, 08:00 IST = 02:30 UTC.
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call issue-details refresh endpoint
        run: |
          curl -sf -X POST "${{ secrets.BACKEND_URL }}/api/cron/issue-details?token=${{ secrets.CRON_SECRET }}"
