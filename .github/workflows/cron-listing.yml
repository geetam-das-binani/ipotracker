name: Cron - Listing Price and Gain

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call listing refresh endpoint
        run: |
          curl -sf -X POST "${{ secrets.BACKEND_URL }}/api/cron/listing?token=${{ secrets.CRON_SECRET }}"
