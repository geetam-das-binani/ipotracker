name: Cron - Subscriptions

# DR-5: every 30 min, 10:00-18:00 IST = 04:30-12:30 UTC. Two schedule
# entries for the same reason vercel.json originally needed two: a
# single "*/30 4-12" would fire 30 min early at 04:00 UTC (09:30 IST).
on:
  schedule:
    - cron: "30 4 * * *"
    - cron: "*/30 5-12 * * *"
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab, for testing

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call subscriptions refresh endpoint
        run: |
          curl -sf -X POST "${{ secrets.BACKEND_URL }}/api/cron/subscriptions?token=${{ secrets.CRON_SECRET }}"
